<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Hasta Arama</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hasta Arama">
<meta name="theme-color" content="#c41230">
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --text: #1a1f2b; --muted: #687083; --line: #e3e7ee;
    --accent: #c41230; --ok-bg: #e5f5ea; --ok: #17723a; --no-bg: #f3f4f6; --no: #6b7280;
    --warn-bg: #fff6e0; --warn: #7a5300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --card: #1b212b; --text: #e8ecf2; --muted: #9aa3b2; --line: #2b3340;
      --accent: #f0727f; --ok-bg: #173323; --ok: #7fd69c; --no-bg: #252b35; --no: #a3abb8;
      --warn-bg: #3a2f12; --warn: #f3d28a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  #menu { background: transparent; color: var(--muted); font-size: 22px; padding: 0 6px; line-height: 1; }
  #panel { display: none; position: absolute; right: 16px; top: calc(46px + env(safe-area-inset-top)); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.15); overflow: hidden; z-index: 10; }
  #panel.open { display: block; }
  #panel button { display: block; width: 100%; text-align: left; background: transparent; color: var(--text);
    border-radius: 0; padding: 12px 18px; font-weight: 500; border-bottom: 1px solid var(--line); }
  #panel button:last-child { border-bottom: 0; }
  form { display: flex; gap: 8px; }
  body.signed-out form, body.signed-out #menu { display: none; }
  input[type=search] { flex: 1; min-width: 0; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--text); outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  button { font-size: 17px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent);
    color: #fff; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0b1420; } }
  #status { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 18px; }
  main { padding: 14px 16px calc(40px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
  .status { color: var(--muted); text-align: center; padding: 24px 0; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin: 0 0 12px; }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; padding: 14px 16px; }
  .login { text-align: center; padding: 28px 20px; }
  .big { padding: 14px 22px; width: 100%; margin: 6px 0 10px; }
  .small { color: var(--muted); font-size: 13px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .name { font-size: 19px; font-weight: 650; }
  .proto { color: var(--muted); font-size: 15px; }
  .copy { font-size: 14px; padding: 6px 12px; border-radius: 9px; background: transparent;
    color: var(--accent); border: 1px solid var(--line); flex-shrink: 0; }
  .lead { margin: 12px 0 6px; }
  .op { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 8px; padding: 3px 0; }
  .k { color: var(--muted); }
  .v { word-break: break-word; }
  .pill { display: inline-block; font-weight: 650; font-size: 14px; padding: 2px 10px; border-radius: 999px; }
  .pill.yes { background: var(--ok-bg); color: var(--ok); }
  .pill.no { background: var(--no-bg); color: var(--no); }
  .files a { display: block; color: var(--accent); text-decoration: none; margin-top: 4px; }
  .sub { display: flex; gap: 8px; margin-top: 8px; padding-left: 4px; }
  .subn { color: var(--muted); font-weight: 650; min-width: 18px; padding-top: 3px; }
  .subb { flex: 1; border-left: 2px solid var(--line); padding-left: 10px; }
  .note { background: var(--no-bg); border-radius: 10px; padding: 9px 12px; font-size: 15px; margin-bottom: 12px; }
  .sug { margin: 4px 0 12px; }
  .sug .k { font-size: 14px; margin-bottom: 6px; }
  .sugb { display: block; width: 100%; text-align: left; background: var(--bg); color: var(--accent);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 17px; font-weight: 600; }
  .sugb span { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .rowlink { font-size: 13px; color: var(--muted); text-decoration: none; }
  @media (max-width: 380px) { .row { grid-template-columns: 1fr; gap: 0; } .k { font-size: 14px; } }
</style>
</head>
<body class="signed-out">
<header>
  <div class="top">
    <h1>Hasta Arama</h1>
    <button id="menu" aria-label="Menü">⋯</button>
  </div>
  <div id="panel">
    <button data-act="refresh">Tabloları yenile</button>
    <button data-act="switch">Hesap değiştir</button>
    <button data-act="logout">Çıkış yap</button>
  </div>
  <form id="f" autocomplete="off">
    <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Ad soyad veya protokol no">
    <button type="submit">Ara</button>
  </form>
  <div id="status"></div>
</header>
<main id="out"><div class="status"><div class="spinner"></div>Yükleniyor…</div></main>
<script src="core.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
